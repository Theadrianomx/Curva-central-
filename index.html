<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sintonizando Multiverso | RICK OS</title>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <video id="video-background" autoplay loop muted playsinline style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; opacity: 0.2;">
        <source src="curvaCentral.mp4" type="video/mp4">
    </video>

    <div class="top-links">
        <a href="#" class="btn-top btn-comunidad">COMUNIDAD</a>
        <a href="https://whatsapp.com/channel/0029Vb9Bqsb6BIEnmJM5fO3r" target="_blank" class="btn-top btn-canal">CANAL OFICIAL</a>
    </div>

    <h1>RICK OS NÚCLEO</h1>

    <div class="container">
        <!-- CARD STATUS -->
        <div class="card card-status">
            <h2>ESTADO DEL SISTEMA</h2>
            <div class="status-box">
                <div class="status-indicator">
                    <div class="pulse"></div>
                    CONECTADO AL MULTIVERSO
                </div>
                <div>DIMENSIONES ACTIVAS: <span id="total_bots" class="stats-ok">0</span></div>
            </div>
        </div>

        <!-- CARD INYECTOR -->
        <div class="card card-injector">
            <h2>INYECTOR DE CÓDIGO (NUEVO BOT)</h2>
            <div class="creator-form">
                <input type="text" id="input_numero" placeholder="Ej: 5219991234567">
                <button onclick="solicitarCodigo()">GENERAR PAIRING CODE</button>
            </div>
            <div id="codigo_generado">
                <span id="pairing_text"></span>
            </div>
        </div>

        <!-- CARD RADAR -->
        <div class="card card-radar">
            <h2>RADAR DE SUB-BOTS</h2>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>ID (NÚMERO)</th>
                            <th>FIRMA</th>
                            <th>UPTIME</th>
                            <th>COMANDOS</th>
                            <th>ERRORES</th>
                            <th>ACCIÓN</th>
                        </tr>
                    </thead>
                    <tbody id="tabla_bots">
                        <tr><td colspan="6" class="loading">Sintonizando radar dimensional...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="core.js"></script>
</body>
</html>
